[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crust-and-co"
version = "0.1.0"
description = "Console voice support foundation for Crust & Co."
requires-python = ">=3.13,<3.14"
dependencies = [
    "livekit-agents==1.8.10",
    "pydantic>=2,<3",
    "python-dotenv>=1.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
